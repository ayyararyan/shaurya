name: Sync JEPA branch with main

# Timer migrated to this Mac's launchd; GitHub supplies dispatch, not compute.
on:
  workflow_dispatch: {}

concurrency:
  group: shaurya-jepa-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'ayyararyan/shaurya' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    runs-on: [self-hosted, macOS, ARM64, aryan-mac-scheduled]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shaurya_28-08-2026_JEPA
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Attempt merge from main
        id: merge
        run: |
          git fetch origin main
          if git merge origin/main --no-edit; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - name: Push if clean
        if: steps.merge.outputs.clean == 'true'
        run: git push origin shaurya_28-08-2026_JEPA

      - name: Open PR if conflicted
        if: steps.merge.outputs.clean == 'false'
        run: |
          git fetch origin main
          git checkout -b sync/main-into-jepa-$(date +%Y%m%d)
          git push origin HEAD
          gh pr create --base shaurya_28-08-2026_JEPA --head sync/main-into-jepa-$(date +%Y%m%d) \
            --title "Sync main into JEPA branch (conflicts, needs manual merge)" \
            --body "Auto-sync detected conflicts merging main into shaurya_28-08-2026_JEPA. Resolve manually."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
